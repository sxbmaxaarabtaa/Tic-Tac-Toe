<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Tic Tac Toe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Syne',sans-serif;
  background:#0b0b12;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.container{
  width:100%;
  max-width:500px;
  padding:20px;
}

.card{
  background:#14141d;
  border:1px solid #252535;
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

h1{
  text-align:center;
  font-size:2.4rem;
  margin-bottom:10px;
  background:linear-gradient(135deg,#ffc72c,#ffffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.player-box{
  background:#1b1b27;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  border:1px solid #2d2d40;
}

.player-box h2{
  font-size:1rem;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-bottom:12px;
  background:#111;
  color:white;
  font-size:1rem;
}

.character-select{
  display:flex;
  gap:10px;
}

.character-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.character-btn:hover{
  transform:translateY(-2px);
}

.curry{
  background:#1d428a;
  color:#ffc72c;
}

.ronaldo{
  background:#f0f0f0;
  color:#111;
}

.selected{
  outline:3px solid #ffc72c;
}

.start-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#ffc72c;
  color:black;
  font-weight:900;
  font-size:1rem;
  cursor:pointer;
  margin-top:10px;
}

.hidden{
  display:none;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.turn{
  font-weight:800;
}

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.cell{
  aspect-ratio:1;
  background:#1a1a25;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2rem;
  font-weight:900;
  cursor:pointer;
  transition:0.2s;
}

.cell:hover{
  background:#222233;
  transform:scale(1.05);
}

.cell.x{
  background:#1d428a;
  color:#ffc72c;
}

.cell.o{
  background:#f0f0f0;
  color:black;
}

.status{
  margin-top:20px;
  text-align:center;
  font-weight:700;
  font-size:1.1rem;
}

.restart{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
  cursor:pointer;
}

.winner{
  animation:pop 0.5s ease;
}

@keyframes pop{
  0%{
    transform:scale(0.5);
    opacity:0;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- MENU -->
  <div class="card" id="menu">

    <h1>Tic Tac Toe</h1>
    <p class="subtitle">Curry vs Ronaldo Edition</p>

    <!-- PLAYER 1 -->
    <div class="player-box">

      <h2>Player 1</h2>

      <input type="text" id="p1name" placeholder="Enter Player 1 Name">

      <div class="character-select">

        <button class="character-btn curry selected"
          onclick="selectCharacter(1,'curry')">
          Curry 🏀
        </button>

        <button class="character-btn ronaldo"
          onclick="selectCharacter(1,'ronaldo')">
          Ronaldo ⚽
        </button>

      </div>

    </div>

    <!-- PLAYER 2 -->
    <div class="player-box">

      <h2>Player 2</h2>

      <input type="text" id="p2name" placeholder="Enter Player 2 Name">

      <div class="character-select">

        <button class="character-btn curry"
          onclick="selectCharacter(2,'curry')">
          Curry 🏀
        </button>

        <button class="character-btn ronaldo selected"
          onclick="selectCharacter(2,'ronaldo')">
          Ronaldo ⚽
        </button>

      </div>

    </div>

    <button class="start-btn" onclick="startGame()">
      START GAME
    </button>

  </div>

  <!-- GAME -->
  <div class="card hidden" id="game">

    <div class="top-bar">
      <div class="turn" id="turnText">
        Player Turn
      </div>

      <button class="restart" onclick="restartGame()">
        Restart
      </button>
    </div>

    <div class="board" id="board">

      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>

      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>

      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>

    </div>

    <div class="status" id="status">
      Match Started
    </div>

  </div>

</div>

<script>

let player1 = {
  name:"Player 1",
  character:"curry",
  symbol:"X"
};

let player2 = {
  name:"Player 2",
  character:"ronaldo",
  symbol:"O"
};

let board = ["","","","","","","","",""];
let currentPlayer = player1;
let gameRunning = false;

const winPatterns = [
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
];

function selectCharacter(player, character){

  if(player === 1){

    player1.character = character;

    const buttons =
      document.querySelectorAll('.player-box')[0]
      .querySelectorAll('.character-btn');

    buttons.forEach(btn=>btn.classList.remove('selected'));

    if(character === 'curry'){
      buttons[0].classList.add('selected');
    }else{
      buttons[1].classList.add('selected');
    }

  }

  if(player === 2){

    player2.character = character;

    const buttons =
      document.querySelectorAll('.player-box')[1]
      .querySelectorAll('.character-btn');

    buttons.forEach(btn=>btn.classList.remove('selected'));

    if(character === 'curry'){
      buttons[0].classList.add('selected');
    }else{
      buttons[1].classList.add('selected');
    }

  }

}

function startGame(){

  player1.name =
    document.getElementById('p1name').value || 'Player 1';

  player2.name =
    document.getElementById('p2name').value || 'Player 2';

  document.getElementById('menu').classList.add('hidden');

  document.getElementById('game').classList.remove('hidden');

  currentPlayer = player1;

  gameRunning = true;

  updateTurnText();

}

function updateTurnText(){

  document.getElementById('turnText').textContent =
    currentPlayer.name + "'s Turn";

}

const cells = document.querySelectorAll('.cell');

cells.forEach(cell=>{

  cell.addEventListener('click', ()=>{

    const index = cell.dataset.index;

    if(board[index] !== "" || !gameRunning){
      return;
    }

    board[index] = currentPlayer.symbol;

    if(currentPlayer.symbol === "X"){
      cell.classList.add('x');
      cell.textContent =
        currentPlayer.character === 'curry' ? '30' : '7';
    }else{
      cell.classList.add('o');
      cell.textContent =
        currentPlayer.character === 'curry' ? '30' : '7';
    }

    checkWinner();

  });

});

function checkWinner(){

  let winner = false;

  for(let pattern of winPatterns){

    let a = pattern[0];
    let b = pattern[1];
    let c = pattern[2];

    if(
      board[a] &&
      board[a] === board[b] &&
      board[a] === board[c]
    ){

      winner = true;

    }

  }

  if(winner){

    gameRunning = false;

    document.getElementById('status').innerHTML =
      "<div class='winner'>🏆 " +
      currentPlayer.name +
      " WINS!</div>";

    return;
  }

  if(!board.includes("")){

    gameRunning = false;

    document.getElementById('status').innerHTML =
      "🤝 DRAW!";

    return;
  }

  currentPlayer =
    currentPlayer === player1 ? player2 : player1;

  updateTurnText();

}

function restartGame(){

  board = ["","","","","","","","",""];

  gameRunning = true;

  currentPlayer = player1;

  updateTurnText();

  document.getElementById('status').textContent =
    "New Match Started";

  cells.forEach(cell=>{

    cell.textContent = "";

    cell.classList.remove('x');
    cell.classList.remove('o');

  });

}

</script>

</body>
</html>
